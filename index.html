        /* Registering the colours lets the browser animate them, so
           gradients cross-fade between metals along with flat colours.
           Browsers without @property simply switch instantly. */
        @property --bg-primary { syntax: '<color>'; inherits: true; initial-value: #faf4e6; }
        @property --bg-glow { syntax: '<color>'; inherits: true; initial-value: #f1e2bc; }
        @property --bg-surface { syntax: '<color>'; inherits: true; initial-value: #fffdf9; }
        @property --bg-input { syntax: '<color>'; inherits: true; initial-value: #fbf5e7; }
        @property --accent-primary { syntax: '<color>'; inherits: true; initial-value: #d4af37; }
        @property --accent-text { syntax: '<color>'; inherits: true; initial-value: #7a5600; }
        @property --accent-soft { syntax: '<color>'; inherits: true; initial-value: #f5e6a8; }
        @property --accent-deep { syntax: '<color>'; inherits: true; initial-value: #b8860b; }
        @property --text-primary { syntax: '<color>'; inherits: true; initial-value: #2e1014; }
        @property --text-muted { syntax: '<color>'; inherits: true; initial-value: #6b5630; }
        @property --on-accent { syntax: '<color>'; inherits: true; initial-value: #2a1705; }
        @property --border-subtle { syntax: '<color>'; inherits: true; initial-value: rgba(122, 86, 0, 0.22); }
        @property --border-strong { syntax: '<color>'; inherits: true; initial-value: rgba(122, 86, 0, 0.78); }

        /* Gold is the default theme */
        :root {
            color-scheme: light;
            scrollbar-gutter: stable;

            /* Fixed metal colours, used by the tab swatches in both themes */
            --gold-primary: #d4af37;
            --gold-soft: #f5e6a8;
            --silver-primary: #c0c0c0;
            --silver-soft: #e8e8e8;

            --bg-primary: #faf4e6;
            --bg-glow: #f1e2bc;
            --bg-surface: #fffdf9;
            --bg-input: #fbf5e7;
            --accent-primary: #d4af37;
            --accent-text: #7a5600;
            --accent-soft: #f5e6a8;
            --accent-deep: #b8860b;
            --text-primary: #2e1014;
            --text-muted: #6b5630;
            --on-accent: #2a1705;
            --border-subtle: rgba(122, 86, 0, 0.22);
            --border-strong: rgba(122, 86, 0, 0.78);

            --theme-speed: 400ms;
            --radius: 6px;
            --font-ui: 'Nunito', ui-rounded, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body.theme-silver {
            --bg-primary: #f3f4f6;
            --bg-glow: #dfe2e8;
            --bg-surface: #fdfdfe;
            --bg-input: #f4f5f7;
            --accent-primary: #c0c0c0;
            --accent-text: #474d57;
            --accent-soft: #e8e8e8;
            --accent-deep: #8a8a8a;
            --text-primary: #1c1f24;
            --text-muted: #4f5560;
            --on-accent: #14161a;
            --border-subtle: rgba(71, 77, 87, 0.22);
            --border-strong: rgba(71, 77, 87, 0.78);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Declared on body, not :root, so it picks up the silver overrides */
            --foil: linear-gradient(105deg, var(--accent-deep) 0%, var(--accent-primary) 30%, var(--accent-soft) 50%, var(--accent-primary) 70%, var(--accent-deep) 100%);

            font-family: var(--font-ui);
            background: radial-gradient(130% 460px at 50% 0, var(--bg-glow), transparent 100%) no-repeat, var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            padding-bottom: 40px;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition-property: --bg-primary, --bg-glow, --bg-surface, --bg-input, --accent-primary, --accent-text, --accent-soft, --accent-deep, --text-primary, --text-muted, --on-accent, --border-subtle, --border-strong;
            transition-duration: var(--theme-speed);
            transition-timing-function: ease;
        }

        /* ---------- Header and brand lockup ---------- */

        .header {
            position: relative;
            padding: 26px 16px 22px;
            text-align: center;
        }

        /* Hairline with a centred diamond */
        .header::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 0;
            width: min(280px, 70%);
            height: 1px;
            transform: translateX(-50%);
            background: linear-gradient(90deg, transparent, var(--accent-deep), transparent);
        }

        .header::before {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -3px;
            width: 7px;
            height: 7px;
            margin-left: -3.5px;
            transform: rotate(45deg);
            background: var(--accent-deep);
        }

        .logo {
            font-size: inherit;
            font-weight: inherit;
        }

        .brand-maa-chandi,
        .brand-jewellers {
            display: block;
        }

        .brand-maa-chandi {
            font-family: var(--font-ui);
            font-weight: 800;
            font-size: clamp(32px, 9vw, 42px);
            line-height: 1.15;
            letter-spacing: 0.02em;
            color: var(--accent-text);
        }

        .brand-jewellers {
            font-family: var(--font-ui);
            font-weight: 600;
            font-size: clamp(17px, 4.8vw, 21px);
            line-height: 1.3;
            letter-spacing: 0.12em;
            color: var(--text-primary);
        }

        .subtitle {
            margin-top: 8px;
            font-size: 11px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        /* ---------- Metal switch ---------- */

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-bottom: 16px;
            padding: 4px;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius);
        }

        .tab {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 46px;
            padding: 8px 6px;
            background: transparent;
            border: none;
            border-radius: 4px;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
        }

        /* Each tab shows its own metal, whichever theme is active */
        .tab::before {
            content: '';
            flex: none;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            box-shadow: 0 0 0 1px var(--border-strong);
        }

        .tab:first-child::before {
            background: linear-gradient(135deg, var(--gold-soft), var(--gold-primary));
        }

        .tab:last-child::before {
            background: linear-gradient(135deg, var(--silver-soft), var(--silver-primary));
        }

        .tab:hover {
            color: var(--text-primary);
            background: var(--border-subtle);
        }

        .tab.active {
            background: var(--foil);
            color: var(--on-accent);
        }

        .tab.active::before {
            box-shadow: 0 0 0 1px var(--on-accent);
        }

        /* ---------- Calculator panel ---------- */

        .calculator {
            display: none;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px 12px;
            align-items: end;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius);
            padding: 20px 16px;
            box-shadow: 0 14px 34px rgba(70, 50, 10, 0.1);
            animation: fadeIn 0.3s ease;
        }

        .calculator.active {
            display: grid;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .input-group--wide,
        .calculate-btn,
        .result-card {
            grid-column: 1 / -1;
        }

        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.3;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-field {
            width: 100%;
            min-height: 50px;
            padding: 12px 36px 12px 12px;
            font-family: var(--font-ui);
            font-size: 18px;
            font-weight: 600;
            font-variant-numeric: lining-nums tabular-nums;
            border: 1px solid var(--border-strong);
            border-radius: 4px;
            background: var(--bg-input);
            color: var(--text-primary);
            -webkit-appearance: none;
            appearance: textfield;
        }

        .input-field::-webkit-outer-spin-button,
        .input-field::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .input-field::placeholder {
            color: var(--text-muted);
            opacity: 0.85;
        }

        .input-field:hover {
            border-color: var(--accent-text);
        }

        .input-field:focus {
            border-color: var(--accent-text);
            outline: 2px solid var(--accent-text);
            outline-offset: 1px;
        }

        .input-unit {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .calculate-btn {
            width: 100%;
            min-height: 54px;
            padding: 14px;
            background: var(--foil) 0 0 / 220% 100%;
            border: none;
            border-radius: 4px;
            color: var(--on-accent);
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 4px;
            box-shadow: 0 6px 16px rgba(70, 50, 10, 0.16);
            transition: background-position 0.45s ease;
        }

        .calculate-btn:hover {
            background-position: 100% 0;
        }

        .calculate-btn:active {
            transform: translateY(1px);
        }

        .tab:focus-visible,
        .calculate-btn:focus-visible {
            outline: 2px solid var(--accent-text);
            outline-offset: 2px;
        }

        /* ---------- Result ---------- */

        .result-card {
            display: none;
            background: var(--bg-input);
            border: 1px solid var(--accent-deep);
            border-radius: var(--radius);
            padding: 24px 20px 12px;
            margin-top: 4px;
            text-align: center;
            /* The inner hairline gives the card its certificate-style double frame */
            box-shadow: inset 0 0 0 3px var(--bg-input), inset 0 0 0 4px var(--border-subtle);
        }

        .result-card.show {
            display: block;
            animation: slideUp 0.35s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-label {
            font-size: 12px;
            color: var(--accent-text);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 800;
        }

        .result-price {
            position: relative;
            font-family: var(--font-ui);
            font-size: clamp(25px, 8.2vw, 46px);
            font-weight: 800;
            font-variant-numeric: lining-nums;
            line-height: 1.2;
            color: var(--accent-text);
            overflow-wrap: anywhere;
            margin-bottom: 8px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .result-price::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -4px;
            width: 7px;
            height: 7px;
            margin-left: -3.5px;
            transform: rotate(45deg);
            background: var(--accent-deep);
        }

        .result-currency {
            font-size: 0.68em;
            font-weight: 600;
            margin-right: 4px;
            color: var(--accent-text);
        }

        .breakdown {
            text-align: left;
        }

        .breakdown-item {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0 16px;
            padding: 11px 0;
            font-size: 14px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .breakdown-item:last-child {
            border-bottom: none;
        }

        .breakdown-label {
            color: var(--text-muted);
            font-weight: 700;
        }

        .breakdown-value {
            font-family: var(--font-ui);
            font-size: 16px;
            font-weight: 700;
            font-variant-numeric: lining-nums tabular-nums;
            color: var(--text-primary);
            white-space: nowrap;
            margin-left: auto;
        }

        @media (min-width: 560px) {
            .header {
                padding-top: 36px;
            }

            .calculator {
                padding: 28px;
                gap: 20px 16px;
            }

            .tab {
                font-size: 15px;
            }
        }

        @media (max-width: 400px) {
            .input-field {
                padding: 12px 28px 12px 10px;
                font-size: 16px;
            }

            .input-unit {
                right: 10px;
                font-size: 13px;
            }
        }

        /* Very narrow phones: two columns would clip long values */
        @media (max-width: 359px) {
            .calculator {
                grid-template-columns: minmax(0, 1fr);
            }

            .tab {
                padding: 8px 2px;
                font-size: 13px;
                letter-spacing: 0;
                gap: 5px;
            }

            .calculate-btn {
                padding: 14px 8px;
                font-size: 13px;
                letter-spacing: 0.08em;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body {
                transition-duration: 0ms;
            }

            .calculator,
            .result-card.show {
                animation: none;
            }

            .calculate-btn {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <h1 class="logo"><span class="brand-maa-chandi">MAA CHANDI</span> <span class="brand-jewellers">JEWELLERS</span></h1>
        <div class="subtitle">Premium Gold & Silver</div>
    </header>

    <main class="container">
        <div class="tabs">
            <button class="tab active" aria-pressed="true" onclick="switchTab('gold')">Gold Calculator</button>
            <button class="tab" aria-pressed="false" onclick="switchTab('silver')">Silver Calculator</button>
        </div>

        <section id="goldCalculator" class="calculator active" aria-label="Gold calculator">
            <div class="input-group">
                <label class="input-label" for="goldWeight">WEIGHT</label>
                <div class="input-wrapper">
                    <input type="number" id="goldWeight" class="input-field" placeholder="0.00" step="any" min="0">
                    <span class="input-unit">gm</span>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label" for="goldRate">RATE PER GRAM</label>
                <div class="input-wrapper">
                    <input type="number" id="goldRate" class="input-field" placeholder="0.00" step="any" min="0">
                    <span class="input-unit">₹</span>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label" for="goldMaking">MAKING CHARGES</label>
                <div class="input-wrapper">
                    <input type="number" id="goldMaking" class="input-field" placeholder="0.00" step="any" min="0"
                        value="14">
                    <span class="input-unit">%</span>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label" for="goldHM">HM CHARGES</label>
                <div class="input-wrapper">
                    <input type="number" id="goldHM" class="input-field" placeholder="0.00" step="any" min="0">
                    <span class="input-unit">₹</span>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label" for="goldOthers">OTHERS</label>
                <div class="input-wrapper">
                    <input type="number" id="goldOthers" class="input-field" placeholder="0.00" step="any" min="0">
                    <span class="input-unit">₹</span>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label" for="goldGST">GST</label>
                <div class="input-wrapper">
                    <input type="number" id="goldGST" class="input-field" placeholder="0.00" step="any" min="0"
                        value="3">
                    <span class="input-unit">%</span>
                </div>
            </div>

            <button class="calculate-btn" onclick="calculateGold()">Calculate Gold Price</button>

            <div id="goldResult" class="result-card" aria-live="polite">
                <div class="result-label">Final Gold Price</div>
                <div class="result-price">
                    <span class="result-currency">₹</span><span id="goldFinalPrice">0</span>
                </div>
                <div class="breakdown">
                    <div class="breakdown-item">
                        <span class="breakdown-label">Base Amount:</span>
                        <span class="breakdown-value" id="goldBaseAmount">₹0</span>
                    </div>
                    <div class="breakdown-item">
                        <span class="breakdown-label">Making Charges:</span>
                        <span class="breakdown-value" id="goldMakingAmount">₹0</span>
                    </div>
                    <div class="breakdown-item">
                        <span class="breakdown-label">HM Charges:</span>
                        <span class="breakdown-value" id="goldHMAmount">₹0</span>
                    </div>
                    <div class="breakdown-item">
                        <span class="breakdown-label">Others:</span>
                        <span class="breakdown-value" id="goldOthersAmount">₹0</span>
                    </div>
                    <div class="breakdown-item">
                        <span class="breakdown-label">GST Amount(<span id="gstAmount">3</span><span
                                id="gstAmount">%</span>):</span>
                        <span class="breakdown-value" id="goldGSTAmount">₹0</span>
                    </div>
                </div>
            </div>
        </section>

        <section id="silverCalculator" class="calculator" aria-label="Silver calculator">
            <div class="input-group">
                <label class="input-label" for="silverWeight">WEIGHT</label>
                <div class="input-wrapper">
                    <input type="number" id="silverWeight" class="input-field" placeholder="0.00" step="any" min="0">
                    <span class="input-unit">gm</span>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label" for="silverRate">RATE PER GRAM</label>
                <div class="input-wrapper">
                    <input type="number" id="silverRate" class="input-field" placeholder="0.00" step="any" min="0">
                    <span class="input-unit">₹</span>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label" for="silverMaking">MAKING CHARGES PER GRAM</label>
                <div class="input-wrapper">
                    <input type="number" id="silverMaking" class="input-field" placeholder="0.00" step="any" min="0"
                        value="25">
                    <span class="input-unit">₹</span>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label" for="silverOthers">OTHERS</label>
                <div class="input-wrapper">
                    <input type="number" id="silverOthers" class="input-field" placeholder="0.00" step="any" min="0">
                    <span class="input-unit">₹</span>
                </div>
            </div>

            <div class="input-group input-group--wide">
                <label class="input-label" for="silverGST">GST</label>
                <div class="input-wrapper">
                    <input type="number" id="silverGST" class="input-field" placeholder="0.00" step="any" min="0"
                        value="3">
                    <span class="input-unit">%</span>
                </div>
            </div>

            <button class="calculate-btn" onclick="calculateSilver()">Calculate Silver Price</button>

            <div id="silverResult" class="result-card" aria-live="polite">
                <div class="result-label">Final Silver Price</div>
                <div class="result-price">
                    <span class="result-currency">₹</span><span id="silverFinalPrice">0</span>
                </div>
                <div class="breakdown">
                    <div class="breakdown-item">
                        <span class="breakdown-label">Base Amount:</span>
                        <span class="breakdown-value" id="silverBaseAmount">₹0</span>
                    </div>
                    <div class="breakdown-item">
                        <span class="breakdown-label">Making charges:</span>
                        <span class="breakdown-value" id="silverMakingAmount">₹0</span>

                        <span id="silverMakingRate" style="display:none;">25</span>
                    </div>
                    <div class="breakdown-item">
                        <span class="breakdown-label">Others:</span>
                        <span class="breakdown-value" id="silverOthersAmount">₹0</span>
                    </div>
                    <div class="breakdown-item">
                        <span class="breakdown-label">GST Amount(<span id="gstAmount">3</span><span
                                id="gstAmount">%</span>):</span>
                        <span class="breakdown-value" id="silverGSTAmount">₹0</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        function switchTab(type) {
            const tabs = document.querySelectorAll('.tab');
            const calculators = document.querySelectorAll('.calculator');

            tabs.forEach(tab => tab.classList.remove('active'));
            calculators.forEach(calc => calc.classList.remove('active'));

            if (type === 'gold') {
                tabs[0].classList.add('active');
                document.getElementById('goldCalculator').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('silverCalculator').classList.add('active');
            }
        }

        function calculateGold() {
            const w = parseFloat(document.getElementById('goldWeight').value) || 0;
            const r = parseFloat(document.getElementById('goldRate').value) || 0;
            const m = parseFloat(document.getElementById('goldMaking').value) || 0;
            const h = parseFloat(document.getElementById('goldHM').value) || 0;
            const g = parseFloat(document.getElementById('goldGST').value) || 0;
            const o = parseFloat(document.getElementById('goldOthers').value) || 0;

            const s1 = w * r;

            // Logic: If weight is less than 0.700 gm, making charges = fixed 1200
            let makingAmount;
            if (w < 0.700) {
                makingAmount = 1200;

            } else {
                makingAmount = (m / 100) * s1;

            }

            const s2 = s1 + makingAmount;
            const s3 = s2 + h;
            const s4 = s3 + o;
            const gstAmount = (g / 100) * s4;
            const finalPrice = s4 + gstAmount;

            document.getElementById('goldBaseAmount').textContent = '₹' + s1.toFixed(2);
            document.getElementById('goldMakingAmount').textContent = '₹' + makingAmount.toFixed(2);
            document.getElementById('goldHMAmount').textContent = '₹' + h.toFixed(2);
            document.getElementById('goldOthersAmount').textContent = '₹' + o.toFixed(2);
            document.getElementById('goldGSTAmount').textContent = '₹' + gstAmount.toFixed(2);
            document.getElementById('goldFinalPrice').textContent = finalPrice.toFixed(2);

            document.getElementById('goldResult').classList.add('show');
        }

        function calculateSilver() {
            const w = parseFloat(document.getElementById('silverWeight').value) || 0;
            const r = parseFloat(document.getElementById('silverRate').value) || 0;
            const m = parseFloat(document.getElementById('silverMaking').value) || 0;
            const g = parseFloat(document.getElementById('silverGST').value) || 0;
            const o = parseFloat(document.getElementById('silverOthers').value) || 0;

            const baseAmount = w * r;
            //const makingAmount = w * m;
            if (w <= 5) {
                makingAmount = 150;

            } else {
                makingAmount = w * m;

            }
            const s1 = baseAmount + makingAmount;
            const s2 = s1 + o;
            const gstAmount = (g / 100) * s2;
            const finalPrice = s2 + gstAmount;

            document.getElementById('silverBaseAmount').textContent = '₹' + baseAmount.toFixed(2);
            document.getElementById('silverMakingRate').textContent = m.toFixed(0);
            document.getElementById('silverMakingAmount').textContent = '₹' + makingAmount.toFixed(2);
            document.getElementById('silverOthersAmount').textContent = '₹' + o.toFixed(2);
            document.getElementById('silverGSTAmount').textContent = '₹' + gstAmount.toFixed(2);
            document.getElementById('silverFinalPrice').textContent = finalPrice.toFixed(2);

            document.getElementById('silverResult').classList.add('show');
        }
    </script>
    <script>
        /* Visual only: follows the panel switchTab() has made active. The tab's
           inline onclick runs first, then this click bubbles up to .tabs. */
        (function () {
            const tabs = document.querySelectorAll('.tab');
            const silverPanel = document.getElementById('silverCalculator');

            document.querySelector('.tabs').addEventListener('click', function () {
                const isSilver = silverPanel.classList.contains('active');
                document.body.classList.toggle('theme-silver', isSilver);
                tabs[0].setAttribute('aria-pressed', String(!isSilver));
                tabs[1].setAttribute('aria-pressed', String(isSilver));
            });
        })();
    </script>
</body>

</html>
